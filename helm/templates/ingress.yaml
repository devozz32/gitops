{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.alb.enabled }}
    # AWS ALB Ingress Controller annotations for ALB per namespace
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.alb.groupName | default (printf "%s-alb" .Release.Namespace) }}
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.alb.scheme | default "internet-facing" }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.alb.targetType | default "ip" }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80{{- if .Values.ingress.alb.https }}, "HTTPS": 443{{- end }}}]'
    {{- if .Values.ingress.alb.loadBalancerName }}
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.alb.loadBalancerName }}
    {{- else }}
    alb.ingress.kubernetes.io/load-balancer-name: {{ printf "%s-alb" .Release.Namespace }}
    {{- end }}
    {{- if .Values.ingress.alb.sslPolicy }}
    alb.ingress.kubernetes.io/ssl-policy: {{ .Values.ingress.alb.sslPolicy }}
    {{- end }}
    {{- if .Values.ingress.alb.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.alb.certificateArn }}
    {{- end }}
    {{- if .Values.ingress.alb.healthCheckPath }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.alb.healthCheckPath }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "helm.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
