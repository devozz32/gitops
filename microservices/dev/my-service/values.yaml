# Basic configuration
replicaCount: 1

# AWS ECR Image Configuration
image:
  repository: 553817834164.dkr.ecr.us-east-1.amazonaws.com/luxe-jewelry-store
  pullPolicy: IfNotPresent
  tag: "my-service-v-1.5.5.16"

# Image pull secrets for AWS ECR
imagePullSecrets: []

# Service Account configuration for ECR authentication
serviceAccount:
  create: true
  automount: true
  name: ""

service:
  type: ClusterIP
  port: 80

# ============================================================================
# ConfigMap - Non-sensitive environment variables
# ============================================================================
config:
  env: {}

# ============================================================================
# External Secrets - AWS Secrets Manager
# ============================================================================
secrets:
  - name: jwt
    enabled: true
    aws:
      secretName: prod/jewlerystore/jewelry/jwt
    env:
      JWT_SECRET_KEY: JWT_SECRET

# ============================================================================
# Ingress with ALB - Creates ALB per namespace
# ============================================================================
ingress:
  enabled: true
  # AWS ALB configuration - ALB will be created per namespace
  alb:
    enabled: true
    # groupName: ""  # Leave empty to use default {namespace}-alb
    scheme: internet-facing
    targetType: ip
    https: false
    healthCheckPath: "/my-service/"
    # No rewrite needed - nginx will handle /my-service path directly
  
  # Ingress paths - configure per microservice
  # Omit host to match all hosts (ALB will use its auto-generated DNS name)
  hosts:
    - paths:
        - path: /my-service
          pathType: Prefix

# Resources
resources: {}

# Health Checks
livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

