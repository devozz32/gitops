# Basic configuration
replicaCount: 1

# AWS ECR Image Configuration
image:
  repository: 553817834164.dkr.ecr.us-east-1.amazonaws.com/luxe-jewelry-store
  pullPolicy: IfNotPresent
  tag: "auth-service-v1.0.15.12"

# Image pull secrets for AWS ECR
imagePullSecrets: []

# Service Account configuration for ECR authentication
serviceAccount:
  create: true
  automount: true
  name: ""

service:
  type: ClusterIP
  port: 8001

# ============================================================================
# ConfigMap - Non-sensitive environment variables
# ============================================================================
config:
  env:
    PORT: "8001"
    ENVIRONMENT: "dev"
    LOG_LEVEL: "debug"

# ============================================================================
# External Secrets - AWS Secrets Manager
# ============================================================================
secrets:
  - name: jwt
    enabled: true
    aws:
      secretName: prod/jewlerystore/jewelry/jwt
    env:
      JWT_SECRET: JWT_SECRET

# ============================================================================
# Ingress with ALB - Disabled
# ============================================================================
ingress:
  enabled: false
  alb:
    enabled: false

# Resources
resources: {}

# Health Checks
livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

